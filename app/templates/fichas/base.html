<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>{% block titulo %}Ficha{% endblock %}</title>
  {# Sem fontes, imagens ou CSS externos: o PDF não carrega nada de fora. #}
  <style>
    @page { size: A4; margin: 12mm 16mm 12mm 16mm; }
    * { box-sizing: border-box; }
    body {
      font-family: "Liberation Sans", Arial, "DejaVu Sans", sans-serif;
      font-size: 10.5pt; color: #000; line-height: 1.25; margin: 0;
    }

    /* Cada página é um bloco de altura fixa: o rodapé fica sempre embaixo */
    .pagina { position: relative; height: 268mm; }
    .pagina + .pagina { page-break-before: always; }

    /* Cabeçalho (timbre) */
    .timbre { display: flex; align-items: center; border-bottom: 1px solid #000; padding-bottom: 3mm; margin-bottom: 5mm; }
    .timbre-logo { width: 24mm; height: 17mm; margin-right: 4mm; }
    .timbre-logo img, .rodape-logo img { max-width: 100%; max-height: 100%; }
    .timbre-texto { font-family: "Liberation Serif", "Times New Roman", serif; font-weight: bold; font-size: 8.5pt; line-height: 1.3; }

    /* Rodapé */
    .rodape { position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid #000; padding-top: 2mm; display: flex; align-items: center; }
    .rodape-logo { width: 16mm; height: 14mm; margin-right: 3mm; }
    .rodape-texto { font-family: "Liberation Serif", "Times New Roman", serif; font-weight: bold; font-size: 7pt; line-height: 1.3; }
    .rodape .link { color: #1a3fa0; text-decoration: underline; }

    /* Títulos */
    .titulo { text-align: center; font-weight: bold; text-decoration: underline; font-size: 11pt; margin: 0 0 4mm 0; }
    .creche { color: #1f3b73; font-weight: bold; text-decoration: underline; margin: 0 0 2mm 0; }

    /* Moldura do formulário */
    .moldura { border: 1px solid #000; padding: 2mm 3mm 3mm 3mm; }
    .moldura-titulo { text-align: center; font-weight: bold; margin: 0 0 2.5mm 0; }

    /* Linha de campos com sublinhado: rótulo + espaço preenchido */
    .l { display: flex; align-items: flex-end; margin: 0 0 2.6mm 0; }
    .l .rot { white-space: nowrap; margin-right: 1.5mm; }
    .l .v { flex: 1; border-bottom: 1px solid #000; min-height: 1.25em; padding-left: 1mm; margin-right: 3mm; overflow: hidden; }
    .l .v:last-child { margin-right: 0; }
    .l .f2 { flex: 2; } .l .f3 { flex: 3; } .l .f4 { flex: 4; } .l .f5 { flex: 5; }
    .l .curto { flex: 0 0 18mm; }

    p.texto { margin: 0 0 2.6mm 0; }
    .pergunta { font-weight: bold; margin: 4mm 0 2mm 0; }
    .opcao { margin: 0 0 2.4mm 6mm; }
    .opcao .l { margin: 0; }
    .marca { white-space: pre; }
    .racas span { margin-right: 2.5mm; white-space: nowrap; }

    /* Tabela do núcleo familiar */
    table { width: 100%; border-collapse: collapse; margin: 2mm 0 3mm 0; }
    th, td { border: 1px solid #000; padding: 0 2mm; height: 8.2mm; text-align: left; font-size: 10pt; }
    th { font-size: 8pt; text-align: center; font-weight: bold; text-transform: uppercase; height: 9mm; }
    td.comp { width: 26%; }
    ul.regras { margin: 0 0 3mm 0; padding-left: 6mm; text-align: justify; }
    ul.regras li { margin-bottom: 1.5mm; }
    .obs { margin: 0 0 3mm 0; }
    .obs .rot { font-weight: bold; }

    /* Propriedades: linhas pautadas */
    .pauta { border-bottom: 1px solid #000; min-height: 6.5mm; padding-left: 1mm; }

    /* Declaração e assinatura */
    .alerta { text-align: justify; margin: 5mm 6mm 6mm 6mm; }
    .data-linha { text-align: center; margin: 0 0 9mm 0; }
    .data-linha .sub { display: inline-block; min-width: 14mm; border-bottom: 1px solid #000; text-align: center; }
    .data-linha .sub.mes { min-width: 26mm; } .data-linha .sub.ano { min-width: 22mm; }
    .assinatura { text-align: center; }
    .assinatura .nome { min-height: 5mm; margin-bottom: 0.5mm; }
    .assinatura .traco { border-top: 1px solid #000; width: 62mm; margin: 0 auto 1.5mm auto; }
    .assinatura .bloco { margin-bottom: 8mm; }
  </style>
</head>
<body>
  {% block conteudo %}{% endblock %}
</body>
</html>
