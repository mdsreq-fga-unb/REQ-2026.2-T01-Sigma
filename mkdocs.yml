site_name: SIGMA
site_description: Documentação de requisitos de software para o projeto SIGMA
site_author: Equipe SIGMA

theme:
  name: material
  logo: assets/logo-dark.png
  favicon: assets/favicon.png
  language: pt-BR
  palette:
    # Modo Claro
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    # Modo Escuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      toc_depth: 2

extra_css:
  - stylesheets/custom.css

nav:
  - Início: index.md

  - Visão do Produto e Projeto:
      - 1. Cenário Atual do Cliente e do Negócio: doc-visao/1_cenarioAtual.md
      - 2. Solução Proposta: doc-visao/2_solucao.md
      - 3. Intervenção Social: doc-visao/3_intervencao.md
      - 4. Estratégias de Engenharia de Software: doc-visao/4_estrategias.md
      - 5. Engenharia de Requisitos: doc-visao/5_requisitos.md
      - 6. Cronograma e Entregas: doc-visao/6_cronograma.md
      - 7. Interação entre Equipe e Cliente: doc-visao/7_interacao.md
      - 8. Requisitos de Software: doc-visao/8_requisitos.md
      - 11. Lições Aprendidas: doc-visao/11_licoes.md

  - Entregas:
      - Unidade 1: videos/entrega-videos.md
      - Unidade 2:
          - Atividade 2 - Correção em Pares: atividades/atividade_2.md
          - Atividade 3 - Tabela de Decisão dos Feedbacks: atividades/atividade_3.md
          - Atividade 4 - Avaliação do Valor de Negócio: atividades/atividade_4.md
          - Comprovação das Respostas: "atividades/Priorização de requisitos (respostas) - Respostas ao formulário 1.md"
